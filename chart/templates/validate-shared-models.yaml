{{/*
Fail the release when models.shared.enabled and the owner stack is missing.
Uses lookup against the live API. Skipped during `helm template` / client dry-run
(lookup always empty) by probing the cluster-local kubernetes Service.
*/}}
{{- if and (eq (include "assistant.sharedModelsEnabled" .) "true") (.Values.models.shared.validate | default true) }}
{{- $live := lookup "v1" "Service" "default" "kubernetes" }}
{{- if $live }}
{{- $owner := include "assistant.sharedModelsNamespace" . }}
{{- $llm := lookup "serving.kserve.io/v1beta1" "InferenceService" $owner "llama-32" }}
{{- $hap := lookup "serving.kserve.io/v1beta1" "InferenceService" $owner "guardrails-detector-ibm-hap" }}
{{- $pi := lookup "serving.kserve.io/v1beta1" "InferenceService" $owner "prompt-injection-detector" }}
{{- $missing := list }}
{{- if not $llm }}{{- $missing = append $missing "llama-32" }}{{- end }}
{{- if not $hap }}{{- $missing = append $missing "guardrails-detector-ibm-hap" }}{{- end }}
{{- if not $pi }}{{- $missing = append $missing "prompt-injection-detector" }}{{- end }}
{{- if gt (len $missing) 0 }}
{{- fail (printf "models.shared.enabled=true but missing InferenceService(s) in namespace %q: %s. Install the original lemonade stack first:\n  helm upgrade --install lemonade-stand-assistant ./chart --create-namespace -n %s -f chart/values-lemonade.yaml\nThen verify:\n  oc get inferenceservice -n %s" $owner (join ", " $missing) $owner $owner) }}
{{- end }}
{{- end }}
{{- end }}
