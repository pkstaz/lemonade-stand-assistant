{{- $ns := include "assistant.namespace" . }}
---
kind: ConfigMap
apiVersion: v1
metadata:
  namespace: {{ $ns }}
  name: fms-orchestr8-config-nlp
  annotations:
    helm.sh/weight: "0"
data:
  config.yaml: |
    chunkers:
      sentence:
        type: sentence
        service:
            hostname: chunker-service
            port: 8085
    openai: 
      service:
        hostname: {{ include "assistant.llmHostname" . }}
        # KServe predictor Services are headless: DNS is the pod IP, so use the
        # container port (llama 8080, HAP/PI 8000), not Service port 80.
        port: {{ include "assistant.llmPort" . }}
    detectors:
      regex_competitor:
        type: text_contents
        service:
            hostname: "127.0.0.1"
            port: 8080
        chunker_id: sentence
        default_threshold: 0.5
      hap:
        type: text_contents
        service:
          hostname: {{ include "assistant.hapHostname" . }}
          port: 8000
        chunker_id: sentence
        default_threshold: 0.5
      prompt_injection:
        type: text_contents
        service:
          hostname: {{ include "assistant.promptInjectionHostname" . }}
          port: 8000
        chunker_id: sentence
        default_threshold: 0.5
      language_detection:
        type: text_contents
        service:
          hostname: lingua-detector
          port: 8080
        chunker_id: sentence
        default_threshold: 0.88
