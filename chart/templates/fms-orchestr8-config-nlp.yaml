{{- $ns := include "assistant.namespace" . }}
---
kind: ConfigMap
apiVersion: v1
metadata:
  namespace: {{ $ns }}
  name: fms-orchestr8-config-nlp
  annotations:
    helm.sh/weight: "0"
data:
  config.yaml: |
    chunkers:
      sentence:
        type: sentence
        service:
            hostname: chunker-service
            port: 8085
    openai: 
      service:
        hostname: {{ include "assistant.llmHostname" . }}
        # LLMInferenceService workload Services serve HTTPS (KServe-injected
        # self-signed certs) on the container port (llama 8000, HAP/PI 8000),
        # not Service port 80. tls.insecure skips cert verification; cert_path
        # is required by the orchestrator even when unused.
        port: {{ include "assistant.llmPort" . }}
        tls: kserve-workload
    tls:
      kserve-workload:
        cert_path: /etc/pki/tls/certs/ca-bundle.crt
        insecure: true
    detectors:
      regex_competitor:
        type: text_contents
        service:
            hostname: "127.0.0.1"
            port: 8080
        chunker_id: sentence
        default_threshold: 0.5
      hap:
        type: text_contents
        service:
          hostname: {{ include "assistant.hapHostname" . }}
          port: 8000
        chunker_id: sentence
        default_threshold: 0.5
      prompt_injection:
        type: text_contents
        service:
          hostname: {{ include "assistant.promptInjectionHostname" . }}
          port: 8000
        chunker_id: sentence
        default_threshold: 0.5
      language_detection:
        type: text_contents
        service:
          hostname: lingua-detector
          port: 8080
        chunker_id: sentence
        default_threshold: 0.88
