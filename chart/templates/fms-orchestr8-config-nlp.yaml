{{- $ns := include "assistant.namespace" . }}
---
kind: ConfigMap
apiVersion: v1
metadata:
  namespace: {{ $ns }}
  name: fms-orchestr8-config-nlp
  annotations:
    helm.sh/weight: "0"
data:
  config.yaml: |
    chunkers:
      sentence:
        type: sentence
        service:
            hostname: chunker-service
            port: 8085
    openai: 
      service:
{{- if .Values.models.llm.maasGatewayHost }}
        # Through the MaaS gateway: auth + subscription metering. HTTP:80 keeps
        # the orchestrator's rustls client on HTTP/1.1 (h2 upstreams panic:
        # hyper keep-alive without a timer in fms-orchestr8 0.18.x).
        hostname: {{ .Values.models.llm.maasGatewayHost }}
        port: 80
        path_prefix: {{ include "assistant.llmMaasPathPrefix" . }}
        api_token: MAAS_API_KEY
{{- else }}
        # Direct to the LLMInferenceService workload Service (HTTPS, KServe
        # self-signed certs on the container port, not Service port 80).
        # tls.insecure skips cert verification; cert_path is required by the
        # orchestrator even when unused.
        hostname: {{ include "assistant.llmHostname" . }}
        port: {{ include "assistant.llmPort" . }}
        tls: kserve-workload
{{- end }}
{{- if not .Values.models.llm.maasGatewayHost }}
    tls:
      kserve-workload:
        cert_path: /etc/pki/tls/certs/ca-bundle.crt
        insecure: true
{{- end }}
    detectors:
      regex_competitor:
        type: text_contents
        service:
            hostname: "127.0.0.1"
            port: 8080
        chunker_id: sentence
        default_threshold: 0.5
      hap:
        type: text_contents
        service:
          hostname: {{ include "assistant.hapHostname" . }}
          port: 8000
        chunker_id: sentence
        default_threshold: 0.5
      prompt_injection:
        type: text_contents
        service:
          hostname: {{ include "assistant.promptInjectionHostname" . }}
          port: 8000
        chunker_id: sentence
        default_threshold: 0.5
      language_detection:
        type: text_contents
        service:
          hostname: lingua-detector
          port: 8080
        chunker_id: sentence
        default_threshold: 0.88
