{{- $ns := include "assistant.namespace" . }}
{{- if eq (include "assistant.deployLlm" .) "true" }}
---
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  namespace: {{ $ns }}
  annotations:
    helm.sh/weight: "0"
    openshift.io/display-name: llama-32
  name: llama-32
  labels:
    opendatahub.io/dashboard: 'true'
    opendatahub.io/genai-asset: 'true'
spec:
  model:
    # Model weights (ModelCar OCI) consumed by the platform, not the predictor image.
    uri: oci://quay.io/redhat-ai-services/modelcar-catalog:llama-3.2-3b-instruct
    # Must match the vLLM --served-model-name below: the MaaS gateway rewrites
    # client body model ids to this name before reaching vLLM.
    name: llama32
  replicas: 1
  router:
    route: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    nodeSelector:
{{- with (.Values.models.llm | default dict).nodeSelector }}
{{ toYaml . | indent 6 }}
{{- else }}
      node-role.kubernetes.io/control-plane: ""
{{- end }}
    tolerations:
{{- with (.Values.models.llm | default dict).tolerations }}
{{ toYaml . | indent 6 }}
{{- else }}
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
{{- end }}
    containers:
      - name: main
        image: quay.io/modh/vllm:rhoai-2.19-cuda
        imagePullPolicy: IfNotPresent
        env:
          - name: VLLM_ADDITIONAL_ARGS
            value: "--max-model-len 4096 --max-num-seqs 384 --max-num-batched-tokens 12288 --enable-chunked-prefill --served-model-name llama32"
        resources:
          requests:
            cpu: '1'
            memory: 8Gi
            nvidia.com/gpu: '1'
          limits:
            cpu: '4'
            memory: 20Gi
            nvidia.com/gpu: '1'
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 180
          periodSeconds: 15
          timeoutSeconds: 15
          failureThreshold: 30
---
# Registers the model on the MaaS platform (single-model serving) so it is
# listed by GET /v1/models and subscribable via MaaSSubscription. Requires the
# release namespace to carry the label maas.opendatahub.io/gateway-access=true.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  namespace: {{ $ns }}
  annotations:
    helm.sh/weight: "1"
  name: llama-32
  labels:
    opendatahub.io/dashboard: 'true'
spec:
  modelRef:
    kind: LLMInferenceService
    name: llama-32
{{- end }}
