{{- $app := include "assistant.appName" . }}
{{- $files := include "assistant.filesPath" . }}
{{- $ns := include "assistant.namespace" . }}
{{- $sharedNs := include "assistant.sharedModelsNamespace" . }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $app }}-sa
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: config
    demo-variant: {{ include "assistant.variant" . }}
---
# Allows the app to auto-wake the shared guardrails detectors (scale 0->1)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $app }}-detector-scaler
  namespace: {{ $sharedNs }}
  labels:
    app: {{ $app }}
    demo-variant: {{ include "assistant.variant" . }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $app }}-detector-scaler
  namespace: {{ $sharedNs }}
  labels:
    app: {{ $app }}
    demo-variant: {{ include "assistant.variant" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $app }}-detector-scaler
subjects:
  - kind: ServiceAccount
    name: {{ $app }}-sa
    namespace: {{ $ns }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $app }}-system-prompt
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: config
    demo-variant: {{ include "assistant.variant" . }}
data:
  prompt: |
{{ .Files.Get (printf "%s/system-prompt.txt" $files) | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $app }}-app-files
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: frontend
    demo-variant: {{ include "assistant.variant" . }}
data:
  app_fastapi.py: |
{{ .Files.Get (printf "%s/app_fastapi.py" $files) | indent 4 }}
  index.html: |
{{ .Files.Get (printf "%s/index.html" $files) | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $app }}
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: frontend
    demo-variant: {{ include "assistant.variant" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $app }}
  template:
    metadata:
      labels:
        app: {{ $app }}
        app.kubernetes.io/name: {{ $app }}
        demo-variant: {{ include "assistant.variant" . }}
    spec:
      serviceAccountName: {{ $app }}-sa
      containers:
        - name: {{ $app }}
          image: {{ .Values.app.image | default "quay.io/ckavili/lemon-fastapi:1.0.26" }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http
          env:
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: DEMO_VARIANT
              value: {{ include "assistant.variant" . | quote }}
            - name: GUARDRAILS_ORCHESTRATOR_SERVICE_SERVICE_HOST
              value: "guardrails-orchestrator-service"
            - name: GUARDRAILS_ORCHESTRATOR_SERVICE_SERVICE_PORT
              value: "8032"
            - name: VLLM_MODEL
              value: {{ .Values.model.name | default "llama32" }}
            - name: GUARDRAILS_MODELS_NAMESPACE
              value: {{ $sharedNs }}
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $app }}-secrets
                  key: vllm-api-key
                  optional: true
          volumeMounts:
            - name: system-prompt
              mountPath: /system-prompt
              readOnly: true
            - name: app-files
              mountPath: /application/app_fastapi.py
              subPath: app_fastapi.py
              readOnly: true
            - name: app-files
              mountPath: /application/static/index.html
              subPath: index.html
              readOnly: true
          resources:
            limits:
              cpu: '2'
              memory: 2Gi
            requests:
              cpu: '1'
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      volumes:
        - name: system-prompt
          configMap:
            name: {{ $app }}-system-prompt
            items:
              - key: prompt
                path: prompt
        - name: app-files
          configMap:
            name: {{ $app }}-app-files
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $app }}
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: frontend
    demo-variant: {{ include "assistant.variant" . }}
spec:
  selector:
    app: {{ $app }}
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $app }}
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: frontend
    demo-variant: {{ include "assistant.variant" . }}
  annotations:
    haproxy.router.openshift.io/balance: roundrobin
    haproxy.router.openshift.io/disable_cookies: 'true'
    haproxy.router.openshift.io/rate-limit-connections: 'false'
    haproxy.router.openshift.io/timeout: 300s
    haproxy.router.openshift.io/timeout-tunnel: 300s
spec:
  to:
    kind: Service
    name: {{ $app }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $app }}-secrets
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: config
    demo-variant: {{ include "assistant.variant" . }}
type: Opaque
stringData:
  vllm-api-key: {{ .Values.model.api_key | default "fake" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $app }}
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: monitoring
    demo-variant: {{ include "assistant.variant" . }}
spec:
  selector:
    matchLabels:
      app: {{ $app }}
  endpoints:
    - port: http
      path: /metrics
      interval: 3s
