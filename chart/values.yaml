---
# Demo variant:
#   Original: lemonade
#   Alternatives: en-coffee | es-cafe | es-mate | es-piscola | es-chicha | es-ceviche | es-tacos | es-limonada | es-tequila | pt-cafe | pt-cachaca | pt-limonada | pt-caipirinha
variant: lemonade

# Namespace (use: oc new-project ... or helm --create-namespace)
namespace:
  create: false
  name: ""

# Helm release name (auto: same as namespace)
releaseName: ""

# Main application (name is derived from variant unless overridden)
app:
  name: ""  # auto from variant
  image: quay.io/ckavili/lemon-fastapi:1.0.26

# LLM configuration
# In-cluster llama-32 uses KServe Service port 80. Override for BYO/MaaS.
model: {}
  # name: my-model
  # endpoint: my-maas-instance
  # port: 443
  # api_key: my-api-key

# Shared models across variants (avoid deploying LLM/HAP/PI/MinIO twice)
# Keep Lingua local per variant (language differs).
models:
  # Route LLM calls through the MaaS gateway (single-model serving platform)
  # instead of the in-cluster workload Service. When set, the orchestrator
  # authenticates with the MaaS API key below (subscription metering applies).
  llm:
    # MaaS gateway FQDN, e.g. maas.apps.<cluster-domain>. Empty = direct TLS
    # to the LLMInferenceService workload Service.
    maasGatewayHost: ""
    # MaaS API key bound to the subscription that includes llama-32.
    # Created as Secret `maas-api-key` in the release namespace when set.
    maasApiKey: ""
  # Explicit overrides (optional). When shared.enabled=true these become false.
  # deployLlm: true
  # deployDetectors: true
  shared:
    enabled: false
    # Namespace that already runs lemonade (owns llama + detectors + minio)
    namespace: lemonade-stand-assistant
    # Fail helm install if owner models are missing (live cluster only)
    validate: true

# Detector configuration
# Configure GPU usage and resources for each detector
detectors:
  # IBM HAP Detector (Granite Guardian)
  hap:
    useGpu: false
    # hostname: ""  # override; auto FQDN when models.shared.enabled
    resources:
      requests:
        cpu: '1'
        memory: 4Gi
      limits:
        cpu: '2'
        memory: 8Gi

  # Prompt Injection Detector (DeBERTa v3)
  promptInjection:
    useGpu: false
    # hostname: ""  # override; auto FQDN when models.shared.enabled
    resources:
      requests:
        cpu: '4'
        memory: 16Gi
      limits:
        cpu: '8'
        memory: 24Gi

# Enable openshift dashboard
metrics:
  dashboard:
    enabled: false # requires cluster-admin privileges to install the dashboard
    odc: false

# Shiny Dashboard configuration
shinyDashboard:
  image:
    repository: quay.io/sara_banderby/shinydashboard
    tag: fedora
    pullPolicy: Always
  replicas: 1
  service:
    port: 3838
    targetPort: 3838
  route:
    enabled: true
    host: ""  # Leave empty for auto-generated hostname
  metrics:
    url: ""  # auto: http://<app-name>:8080/metrics
    refreshInterval: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
